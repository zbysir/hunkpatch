name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22', '1.23', 'stable']
        os: [ubuntu-latest]
        include:
          # The package is line-ending sensitive on purpose, so check the
          # platform most likely to disagree about them.
          - go: stable
            os: windows-latest
          - go: stable
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

  js-semantics:
    name: js semantics golden is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: regenerate and diff
        run: |
          node testdata/js_semantics.mjs > /tmp/js_semantics.json
          diff -u testdata/js_semantics.json /tmp/js_semantics.json
